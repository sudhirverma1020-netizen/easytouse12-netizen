<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#030511;
  --bg2:#0a0f29;
  --card:rgba(15,23,54,0.75);

/* IMMERSIVE SPACE BACKGROUND */
.space{
  position:fixed;
  inset:0;
  z-index:-10;
  background:
    radial-gradient(circle at 20% 20%, rgba(138,43,226,0.25), transparent 35%),
    radial-gradient(circle at 80% 30%, rgba(0,240,255,0.18), transparent 30%),
    radial-gradient(circle at 50% 85%, rgba(255,0,127,0.15), transparent 35%),

}

.stars, .stars:before, .stars:after{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(2px 2px at 15% 25%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 35% 65%, #00f0ff, transparent),
    radial-gradient(2px 2px at 55% 15%, #fff, transparent),
    radial-gradient(1px 1px at 75% 85%, #ff007f, transparent),
    radial-gradient(2px 2px at 90% 40%, #fff, transparent);
  opacity:0.6;
  animation:starsMove 30s linear infinite;
}
.stars:before{transform:scale(1.3); opacity:0.3; animation-duration:45s;}
.stars:after{transform:scale(1.8); opacity:0.2; animation-duration:65s;}

@keyframes starsMove{

function calculateAge() {
  const dob = document.getElementById("dob").value;
  const until = document.getElementById("ageUntil").value;
  const resDiv = document.getElementById("ageResult");
  
  if(!dob || !until) {
    alert("कृपया सही तारीख चुनें!");
    return;
  }

  const birthDate = new Date(dob);
  const untilDate = new Date(until);

  if(birthDate > untilDate) {
    alert("जन्म की तारीख भविष्य की नहीं हो सकती!");
    return;
  }

  let years = untilDate.getFullYear() - birthDate.getFullYear();
  let months = untilDate.getMonth() - birthDate.getMonth();
  let days = untilDate.getDate() - birthDate.getDate();

  if (days < 0) {
    months--;
    const prevMonth = new Date(untilDate.getFullYear(), untilDate.getMonth(), 0);
    days += prevMonth.getDate();
  }
  if (months < 0) {
    years--;
    months += 12;
  }

  resDiv.style.display = "block";
  resDiv.querySelector("strong").innerText = `${years} साल, ${months} महीने, ${days} दिन`;
  resDiv.querySelector("span").innerText = "सटीक आयु गणना सफल!";
}

function calculateEMI() {
  const p = parseFloat(document.getElementById("loanAmount").value);
  const annualInterest = parseFloat(document.getElementById("interest").value);
  const years = parseFloat(document.getElementById("years").value);
  const resDiv = document.getElementById("emiResult");

  if(!p || !annualInterest || !years) {
    alert("सभी फील्ड्स भरें!");
    return;
  }

  const r = annualInterest / 12 / 100;
  const n = years * 12;

  const emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
  const totalPayment = emi * n;
  const totalInterest = totalPayment - p;

  resDiv.style.display = "block";
  resDiv.querySelector("strong").innerText = `₹ ${emi.toFixed(2)} / महीना`;
  resDiv.querySelector("span").innerText = `कुल ब्याज: ₹ ${totalInterest.toFixed(2)} | कुल भुगतान: ₹ ${totalPayment.toFixed(2)}`;
}

function calculatePercentage() {
  const percent = parseFloat(document.getElementById("percent").value);
  const num = parseFloat(document.getElementById("percentNumber").value);
  const resDiv = document.getElementById("percentageResult");

  if(isNaN(percent) || isNaN(num)) {
    alert("कृपया दोनों वैल्यू दर्ज करें!");
    return;
  }

  const ans = (percent * num) / 100;
  resDiv.style.display = "block";
  resDiv.querySelector("strong").innerText = `Result: ${ans}`;
  resDiv.querySelector("span").innerText = `${percent}% of ${num} is ${ans}`;
}

function calculateDateDifference() {
  const start = document.getElementById("startDate").value;
  const end = document.getElementById("endDate").value;
  const resDiv = document.getElementById("dateResult");

  if(!start || !end) {
    alert("दोनों तारीखें चुनें!");
    return;
  }

  const d1 = new Date(start);
  const d2 = new Date(end);
  const diffTime = Math.abs(d2 - d1);
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

  resDiv.style.display = "block";
  resDiv.querySelector("strong").innerText = `${diffDays} दिन`;
  resDiv.querySelector("span").innerText = "दो तारीखों के बीच का कुल अंतर";
}

function convertUnit() {
  const val = parseFloat(document.getElementById("unitValue").value);
  const type = document.getElementById("unitType").value;
  const resDiv = document.getElementById("unitResult");

  if(isNaN(val)) {
    alert("कृपया वेलिड वैल्यू डालें!");
    return;
  }

  let result = 0;
  let unitText = "";

  switch(type) {
    case "km-miles":
      result = val * 0.621371;
      unitText = `${val} Kilometer = ${result.toFixed(4)} Miles`;
      break;
    case "miles-km":
      result = val * 1.60934;
      unitText = `${val} Miles = ${result.toFixed(4)} Kilometer`;
      break;
    case "kg-lb":
      result = val * 2.20462;
      unitText = `${val} Kilogram = ${result.toFixed(4)} Pounds`;
      break;
    case "lb-kg":
      result = val * 0.453592;
      unitText = `${val} Pound = ${result.toFixed(4)} Kilograms`;
      break;
    case "meter-feet":
      result = val * 3.28084;
      unitText = `${val} Meter = ${result.toFixed(4)} Feet`;
      break;
    case "feet-meter":
      result = val * 0.3048;
      unitText = `${val} Feet = ${result.toFixed(4)} Meter`;
      break;
    case "cm-inch":
      result = val * 0.393701;
      unitText = `${val} Centimeter = ${result.toFixed(4)} Inches`;
      break;
    case "inch-cm":
      result = val * 2.54;
      unitText = `${val} Inch = ${result.toFixed(4)} Centimeters`;
      break;
  }

  resDiv.style.display = "block";
  resDiv.querySelector("strong").innerText = unitText;
  resDiv.querySelector("span").innerText = "सफल रूपांतरण (Conversion Successful)";
}
